# =============================================================================
# MEETING BOT - GITHUB ACTIONS CI/CD
# Automated testing, linting, and deployment
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: '3.11'

jobs:
  # Code Quality Checks
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 isort mypy bandit
      
      - name: Check formatting (Black)
        run: black --check --line-length=120 meeting-bot.py tests/
      
      - name: Check imports (isort)
        run: isort --check-only meeting-bot.py tests/
      
      - name: Lint (Flake8)
        run: flake8 meeting-bot.py tests/ --max-line-length=120
      
      - name: Type check (MyPy)
        run: mypy meeting-bot.py --ignore-missing-imports || true
      
      - name: Security check (Bandit)
        run: bandit -r meeting-bot.py -ll || true

  # Unit Tests
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: code-quality
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov
      
      - name: Run tests
        run: |
          pytest --cov=meeting_bot --cov-report=xml --cov-report=term-missing -v
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # Docker Build
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: ${{ secrets.DOCKER_USERNAME != '' }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ secrets.DOCKER_USERNAME != '' }}
          tags: |
            meeting-bot:latest
            meeting-bot:${{ github.sha }}
          cache-from: type=registry,ref=meeting-bot:buildcache
          cache-to: type=registry,ref=meeting-bot:buildcache,mode=max

  # Deploy (optional)
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Deploy notification
        run: |
          echo "Deployment would happen here"
          echo "Configure your deployment strategy (SSH, Kubernetes, etc.)"
