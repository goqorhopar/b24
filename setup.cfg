# =============================================================================
# MEETING BOT - CODE QUALITY CONFIGURATION
# Black, Flake8, isort, MyPy configuration
# =============================================================================

[flake8]
max-line-length = 120
extend-ignore = E203, W503
exclude = 
    .git,
    __pycache__,
    build,
    dist,
    *.egg-info,
    venv,
    env,
    .venv,
    recordings,
    logs,
    temp
per-file-ignores =
    __init__.py:F401
    tests/*:S101,D100,D101,D102,D103

[isort]
profile = black
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = 
    .git,
    __pycache__,
    build,
    dist,
    *.egg-info,
    venv,
    env,
    .venv,
    recordings,
    logs,
    temp

[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True
disallow_untyped_defs = False
strict_optional = True
show_error_codes = True
exclude = (build|dist|venv|\.venv|tests)

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

[coverage:run]
source = .
omit = 
    tests/*
    */test_*.py
    setup.py
    */__init__.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
